<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uređivanje Naslovnice / Live Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f4;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 260px;
            background-color: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
        }

        .logo-area h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: #000;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .back-link {
            font-size: 0.8rem;
            color: #666;
            text-decoration: underline;
        }

        /* Main Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: #fafafa;
        }

        header {
            background-color: #fff;
            padding: 20px 40px;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .editor-container {
            padding: 40px;
            max-width: 700px;
        }

        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            border: 1px solid #ccc;
            resize: vertical;
        }

        .btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-weight: 600;
            align-self: flex-start;
        }

        .btn:hover {
            background: #333;
        }

        .success-msg {
            font-size: 0.85rem;
            color: green;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div>
            <div class="logo-area">
                <h2>Live Editor</h2>
            </div>
            <ul class="nav-links">
                <li><a href="#">Uredi Naslovnicu</a></li>
            </ul>
        </div>
        <div>
            <a href="index.html" class="back-link">← Natrag na web stranicu</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main>
        <header>
            <h1>Brzo Uređivanje Teksta</h1>
        </header>

        <div class="editor-container">
            <div class="card">
                <div class="form-group">
                    <label for="titleInput">Glavni Naslov (Ime i prezime):</label>
                    <textarea id="titleInput" placeholder="Jurica&#10;Pavičić"></textarea>
                    <span style="font-size: 0.75rem; color: #666;">Koristite novi red (Enter) za prelazak u novi red kao na naslovnici.</span>
                </div>

                <button class="btn" id="saveBtn">Spremi promjene</button>
                <div class="success-msg" id="successMsg">Promjene su uspješno spremljene!</div>
            </div>
        </div>
    </main>

    <script>
        const titleInput = document.getElementById('titleInput');
        const saveBtn = document.getElementById('saveBtn');
        const successMsg = document.getElementById('successMsg');

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('jurica_site_title');
            if (saved) {
                titleInput.value = saved;
            } else {
                titleInput.value = "Jurica\nPavičić";
            }
        });

        saveBtn.addEventListener('click', () => {
            localStorage.setItem('jurica_site_title', titleInput.value);
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        });
    </script>

</body>
</html>
