<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #f4f4f4; color: #111; }
        
        /* --- Login Overlay Screen --- */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #fff;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            width: 100%; max-width: 360px;
            padding: 40px;
            text-align: center;
        }
        .login-box h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            margin-bottom: 15px; font-family: inherit; font-size: 0.95rem; text-align: center;
        }
        .login-box button {
            width: 100%; background: #000; color: #fff; border: none;
            padding: 12px; cursor: pointer; text-transform: uppercase;
            font-size: 0.75rem; letter-spacing: 1.5px;
        }
        .login-box button:hover { background: #333; }
        .login-error { color: #b22222; font-size: 0.8rem; margin-top: 10px; display: none; }

        /* --- Dashboard Layout (Hidden until logged in) --- */
        #dashboardContainer { display: none; width: 100%; height: 100%; }
        aside { width: 260px; background: #111; color: #fff; padding: 30px 20px; display: flex; flex-direction: column; justify-content: space-between; }
        aside h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 30px; opacity: 0.7; }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .nav-links button { background: none; border: none; color: #aaa; text-align: left; font-size: 0.9rem; padding: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s, background 0.2s; font-family: inherit; width: 100%; }
        .nav-links button:hover, .nav-links button.active { color: #fff; background: rgba(255,255,255,0.08); }
        
        .admin-actions { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .admin-actions a, .admin-actions button { color: #aaa; background: none; border: none; text-align: left; text-decoration: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; font-family: inherit; padding: 0; }
        .admin-actions a:hover, .admin-actions button:hover { color: #fff; }

        main { flex: 1; padding: 50px; overflow-y: auto; background: #fff; }
        .panel { display: none; max-width: 800px; }
        .panel.active { display: block; }
        
        h1 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: -0.5px; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; color: #555; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ddd; font-family: inherit; font-size: 0.95rem; }
        textarea { height: 160px; line-height: 1.5; }
        
        .save-btn { background: #000; color: #fff; border: none; padding: 12px 24px; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1.5px; }
        .save-btn:hover { background: #333; }
        .success-msg { color: #2e7d32; font-size: 0.85rem; margin-left: 15px; opacity: 0; transition: opacity 0.3s; }
        .success-msg.show { opacity: 1; }
    </style>
</head>
<body>

    <!-- Password Login Screen -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Admin Prijava</h2>
            <form id="loginForm">
                <input type="password" id="adminPasswordInput" placeholder="Unesite lozinku" required>
                <button type="submit">Prijava</button>
                <div class="login-error" id="loginError">Netočna lozinka.</div>
            </form>
        </div>
    </div>

    <!-- Main Dashboard Container (Protected) -->
    <div id="dashboardContainer">
        <!-- Sidebar Navigation Hub -->
        <aside>
            <div>
                <h2>Admin Hub</h2>
                <ul class="nav-links">
                    <li><button class="tab-btn active" data-target="frontpage-panel">Naslovnica (Index)</button></li>
                    <li><button class="tab-btn" data-target="book-panel">Usta puna mora (Knjiga)</button></li>
                </ul>
            </div>
            <div class="admin-actions">
                <a href="index.html" target="_blank">Pogledaj live stranicu ↗</a>
                <button id="logoutBtn" type="button">Odjava</button>
            </div>
        </aside>

        <!-- Editing Panels -->
        <main>
            <!-- 1. Frontpage Edit Panel -->
            <section id="frontpage-panel" class="panel active">
                <h1>Uređivanje: Naslovnica</h1>
                <form id="form-frontpage" data-storage="site_data_frontpage">
                    <div class="form-group">
                        <label>Glavni naslov / Ime autora</label>
                        <input type="text" name="heroTitle" value="Jurica Pavičić">
                    </div>
                    <div class="form-group">
                        <label>Kratka biografija / Uvodni tekst</label>
                        <textarea name="bioText">Pisac, scenarist i filmski kritičar...</textarea>
                    </div>
                    <button type="submit" class="save-btn">Spremi promjene</button>
                    <span class="success-msg">Spremljeno!</span>
                </form>
            </section>

            <!-- 2. Book Page Edit Panel -->
            <section id="book-panel" class="panel">
                <h1>Uređivanje: Usta puna mora</h1>
                <form id="form-book" data-storage="book_data_usta_puna_mora">
                    <div class="form-group">
                        <label>Naslov knjige</label>
                        <input type="text" name="bookTitle" value="Usta puna mora">
                    </div>
                    <div class="form-group">
                        <label>Podnaslov</label>
                        <input type="text" name="bookSubtitle" value="Roman">
                    </div>
                    <div class="form-group">
                        <label>Godina</label>
                        <input type="text" name="bookYear" value="2024.">
                    </div>
                    <div class="form-group">
                        <label>Glavni sadržaj (O knjizi)</label>
                        <textarea name="bookBodyContent">&lt;h2&gt;O knjizi&lt;/h2&gt;&lt;p&gt;lorem ipsum...&lt;/p&gt;</textarea>
                    </div>
                    <button type="submit" class="save-btn">Spremi promjene</button>
                    <span class="success-msg">Spremljeno!</span>
                </form>
            </section>
        </main>
    </div>

    <script>
        // --- Password Security Settings ---
        // Change 'tvoja_lozinka' to whatever secure password you prefer!
        const CORRECT_PASSWORD = 'marija123'; 
        const sessionKey = 'admin_logged_in_auth';

        const loginOverlay = document.getElementById('loginOverlay');
        const dashboardContainer = document.getElementById('dashboardContainer');
        const loginForm = document.getElementById('loginForm');
        const adminPasswordInput = document.getElementById('adminPasswordInput');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');

        // Check if already logged in during this browser session
        if (sessionStorage.getItem(sessionKey) === 'true') {
            unlockDashboard();
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (adminPasswordInput.value === CORRECT_PASSWORD) {
                sessionStorage.setItem(sessionKey, 'true');
                unlockDashboard();
            } else {
                loginError.style.display = 'block';
                adminPasswordInput.value = '';
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem(sessionKey);
            dashboardContainer.style.display = 'none';
            loginOverlay.style.display = 'flex';
            adminPasswordInput.value = '';
        });

        function unlockDashboard() {
            loginOverlay.style.display = 'none';
            dashboardContainer.style.display = 'flex';
        }

        // --- Tab Switching Logic ---
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.panel');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));

                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        // --- Load & Save Logic for All Forms ---
        const forms = document.querySelectorAll('form[data-storage]');

        forms.forEach(form => {
            const storageKey = form.getAttribute('data-storage');
            const successMsg = form.querySelector('.success-msg');

            const savedData = JSON.parse(localStorage.getItem(storageKey));
            if (savedData) {
                for (const [key, value] of Object.entries(savedData)) {
                    if (form.elements[key]) {
                        form.elements[key].value = value;
                    }
                }
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const dataObject = {};

                formData.forEach((value, key) => {
                    dataObject[key] = value;
                });

                localStorage.setItem(storageKey, JSON.stringify(dataObject));

                successMsg.classList.add('show');
                setTimeout(() => {
                    successMsg.classList.remove('show');
                }, 2500);
            });
        });
    </script>
</body>
</html>
