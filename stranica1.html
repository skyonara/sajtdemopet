<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usta puna mora — Jurica Pavičić</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Subtle architectural border frame */
        body::after {
            content: '';
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            pointer-events: none;
            z-index: 9999;
        }

        /* Top Bar: Back Button & Menu Toggle */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 50px;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
        }

        .back-link {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #000;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* Menu Button Top Right */
        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 10px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .menu-btn:hover {
            opacity: 1;
        }

        .menu-line {
            display: block;
            width: 26px;
            height: 1.5px;
            background-color: #000;
            margin-bottom: 6px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .menu-line:last-of-type {
            margin-bottom: 0;
        }

        .menu-text {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            color: #000;
        }

        /* Main Content Layout - Wider Text Container */
        .content-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 140px 40px 100px 40px;
        }

        .book-header {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 50px;
            align-items: start;
            margin-bottom: 60px;
        }

        .book-cover {
            width: 100%;
            border: 1px solid #eaeaea;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .book-cover img {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(102%);
        }

        .book-meta-info h1 {
            font-size: clamp(2rem, 3.5vw, 3.2rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .book-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .book-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #444;
        }

        .book-details-grid span strong {
            color: #000;
        }

        /* Detailed Description Sections */
        .book-body {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #222;
        }

        .book-body h2 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin-top: 40px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .book-body p {
            margin-bottom: 24px;
        }

        /* Fullscreen Menu Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            z-index: 99998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-nav {
            list-style: none;
            text-align: center;
        }

        .menu-nav > li {
            margin-bottom: 24px;
        }

        .menu-nav a, .submenu-toggle {
            font-size: clamp(1.5rem, 3.5vw, 2.8rem);
            text-decoration: none;
            color: #000;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s, letter-spacing 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .menu-nav a:hover, .submenu-toggle:hover {
            color: #555;
            letter-spacing: 0px;
        }

        .has-submenu {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .submenu-toggle::after {
            content: '+';
            font-size: 1.2rem;
            font-weight: 300;
            transition: transform 0.3s ease;
        }

        .has-submenu.open .submenu-toggle::after {
            transform: rotate(45deg);
        }

        .submenu {
            list-style: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .has-submenu.open .submenu {
            max-height: 220px;
        }

        .submenu li {
            margin-top: 14px;
        }

        .submenu a {
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 400;
            color: #555;
            letter-spacing: -0.5px;
        }

        .submenu a:hover {
            color: #000;
            letter-spacing: 0px;
        }

        body.menu-open .menu-btn {
            opacity: 1;
        }
        body.menu-open .menu-line:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        body.menu-open .menu-line:nth-child(2) {
            opacity: 0;
        }
        body.menu-open .menu-line:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        @media (max-width: 800px) {
            body::after { display: none; }
            .top-bar { padding: 20px; }
            .content-container { padding: 100px 20px 60px 20px; }
            .book-header {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .book-cover {
                max-width: 240px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <a href="index.html" class="back-link">← Povratak na naslovnicu</a>
        <button class="menu-btn" id="menuToggle" type="button" aria-label="Toggle menu">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-text" id="menuLabel">meni</span>
        </button>
    </div>

    <!-- Fullscreen Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <ul class="menu-nav">
            <li><a href="index.html#biography" class="menu-link">Biografija</a></li>
            <li class="has-submenu" id="submenuParent">
                <button class="submenu-toggle" id="submenuToggle" type="button">Knjige / Proza</button>
                <ul class="submenu">
                    <li><a href="index.html#novels" class="menu-link">Romani</a></li>
                    <li><a href="#stories" class="menu-link">Zbirke priča</a></li>
                    <li><a href="#essays" class="menu-link">Eseji / Publicistika</a></li>
                </ul>
            </li>
            <li><a href="index.html#texts" class="menu-link">Tekstovi</a></li>
            <li><a href="index.html#contact" class="menu-link">Kontakt</a></li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <main class="content-container">
        <div class="book-header">
            <div class="book-cover">
                <!-- Replace with actual book cover image link -->
                <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=800&auto=format&fit=crop" alt="Usta puna mora">
            </div>
            <div class="book-meta-info">
                <h1>Naslov</h1>
                <div class="subtitle">Roman</div>
                <div class="book-details-grid">
                    <span><strong>Godina:</strong> 2024.</span>
                    <span><strong>Izdavač:</strong> </span>
                    <span><strong>Info:</strong> </span>
                    <span><strong>ISBN:</strong>1234...</span>
                </div>
            </div>
        </div>

        <div class="book-body">
            <h2>O knjizi</h2>
            <p>
lorem ipsum...            </p>
            <p>
dolor sit amet...            </p>

            <h2>sekcija 2</h2>
            <p>
                <em>Tekst...</em>
            </p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menuToggle');
            const menuOverlay = document.getElementById('menuOverlay');
            const menuLabel = document.getElementById('menuLabel');
            const menuLinks = document.querySelectorAll('.menu-link');
            const submenuParent = document.getElementById('submenuParent');
            const submenuToggle = document.getElementById('submenuToggle');

            if (!menuToggle || !menuOverlay) return;

            menuToggle.addEventListener('click', (e) => {
                e.preventDefault();
                document.body.classList.toggle('menu-open');
                menuOverlay.classList.toggle('active');
                menuLabel.innerText = menuOverlay.classList.contains('active') ? 'zatvori' : 'meni';
                if (!menuOverlay.classList.contains('active')) submenuParent.classList.remove('open');
            });

            submenuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                submenuParent.classList.toggle('open');
            });

            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    document.body.classList.remove('menu-open');
                    menuOverlay.classList.remove('active');
                    menuLabel.innerText = 'meni';
                    submenuParent.classList.remove('open');
                });
            });
        });
    </script>
</body>
</html>
