<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zemlja bez sutona – Marija Andrijašević</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            min-height: 100%;
            width: 100%;
            background-color: #f6e2b7;
            color: #2F5233;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigacija */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 35px 50px;
            z-index: 1000;
        }

        .menu-container {
            position: relative;
        }

        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 10px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .menu-btn:hover {
            opacity: 1;
        }

        .menu-line {
            display: block;
            width: 26px;
            height: 1.5px;
            background-color: #2F5233;
            margin-bottom: 6px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .menu-line:last-of-type {
            margin-bottom: 0;
        }

        .menu-text {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            color: #2F5233;
            font-weight: 500;
        }

        .menu-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            background-color: #f6e2b7;
            border: 1px solid rgba(47, 82, 51, 0.2);
            min-width: 240px;
            padding: 20px 24px;
            z-index: 99998;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        .menu-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-nav {
            list-style: none;
            text-align: right;
        }

        .menu-nav > li {
            margin-bottom: 14px;
        }

        .menu-nav > li:last-child {
            margin-bottom: 0;
        }

        .menu-nav a {
            font-size: 1.05rem;
            text-decoration: none;
            color: #2F5233;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s;
            display: inline-block;
        }

        .menu-nav a:hover {
            color: #4A7A4F;
        }

        .has-submenu {
            cursor: pointer;
        }

        .submenu {
            list-style: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            text-align: right;
            margin-top: 6px;
        }

        .has-submenu.open .submenu {
            max-height: 250px;
        }

        .submenu li {
            margin-top: 8px;
        }

        .submenu a {
            font-size: 0.9rem;
            font-weight: 400;
            color: #426946;
            text-transform: none;
        }

        body.menu-open .menu-btn { opacity: 1; }
        body.menu-open .menu-line:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        body.menu-open .menu-line:nth-child(2) { opacity: 0; }
        body.menu-open .menu-line:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

        /* Pročišćeni Editorial Layout */
        .editorial-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 160px 60px 100px 60px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 100px;
            align-items: start;
        }

        /* Lijevi dio: Tipografija */
        .content-col {
            display: flex;
            flex-direction: column;
        }

        .meta-header {
            display: flex;
            gap: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .book-title {
            font-size: clamp(2.8rem, 4.5vw, 4.8rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 0.92;
            color: #2F5233;
            margin-bottom: 40px;
        }

        .editorial-body {
            max-width: 520px;
            margin-bottom: 50px;
        }

        .editorial-body p {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.7;
            color: #2F5233;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .back-nav {
            margin-top: 20px;
        }

        .back-link {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: #2F5233;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.5;
        }

        /* Desni dio: Čisti vizualni element bez ramova i sjenki */
        .visual-col {
            margin-top: 10px;
        }

        .visual-media {
            width: 100%;
            display: block;
        }

        .visual-media img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.75;
            transition: opacity 0.3s ease;
        }

        .visual-media img:hover {
            opacity: 0.95;
        }

        .visual-caption {
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            opacity: 0.5;
            margin-top: 12px;
            text-align: left;
            font-weight: 400;
        }

        @media (max-width: 900px) {
            .editorial-wrapper {
                grid-template-columns: 1fr;
                padding: 120px 24px 60px 24px;
                gap: 60px;
            }
            .visual-col {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <div class="menu-container">
            <button class="menu-btn" id="menuToggle" type="button" aria-label="Toggle menu">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-text" id="menuLabel">meni</span>
            </button>

            <div class="menu-dropdown" id="menuDropdown">
                <ul class="menu-nav">
                    <li><a href="index.html" class="menu-link">Početna</a></li>
                    <li><a href="biografija.html" class="menu-link">Biografija</a></li>
                    <li class="has-submenu open" id="submenuToggle">
                        <a href="javascript:void(0);">Romani</a>
                        <ul class="submenu" style="max-height: 250px;">
                            <li><a href="stranica1.html" class="menu-link" style="font-weight: 600;">Zemlja bez sutona</a></li>
                            <li><a href="temeljenjekuce.html" class="menu-link">Temeljenje kuće</a></li>
                            <li><a href="ligaribara.html" class="menu-link">Liga ribara</a></li>
                            <li><a href="stranica4.html" class="menu-link">Davide, svašta su mi radili</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="editorial-wrapper">
        <article class="content-col">
            <div class="meta-header">
                <span>Roman</span>
                <span>—</span>
                <span>Fraktura, 2021.</span>
            </div>
            
            <h1 class="book-title">Zemlja bez<br>sutona</h1>

            <div class="editorial-body">
                <p>opis knjige</p>
            </div>

            <div class="back-nav">
                <a href="index.html" class="back-link">&#8592; Povratak</a>
            </div>
        </article>

        <!-- Svedena i čista prezentacija slike -->
        <aside class="visual-col">
            <div class="visual-media">
                <img src=https://i.imgur.com/VDKx2tY.jpeg" alt="Zemlja bez sutona" referrerpolicy="no-referrer" onerror="this.src='slika.png';">
            </div>
            <p class="visual-caption">Arhivski vizual / Detalj</p>
        </aside>
    </main>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menuToggle');
            const menuDropdown = document.getElementById('menuDropdown');
            const menuLabel = document.getElementById('menuLabel');
            const submenuParent = document.getElementById('submenuToggle');

            if (menuToggle && menuDropdown) {
                menuToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.body.classList.toggle('menu-open');
                    menuDropdown.classList.toggle('active');
                    if (menuLabel) {
                        menuLabel.innerText = menuDropdown.classList.contains('active') ? 'zatvori' : 'meni';
                    }
                });
            }

            if (submenuParent) {
                submenuParent.addEventListener('click', (e) => {
                    e.stopPropagation();
                    submenuParent.classList.toggle('open');
                });
            }

            document.addEventListener('click', (e) => {
                if (menuToggle && menuDropdown && !menuToggle.contains(e.target) && !menuDropdown.contains(e.target)) {
                    document.body.classList.remove('menu-open');
                    menuDropdown.classList.remove('active');
                    if (submenuParent) submenuParent.classList.remove('open');
                    if (menuLabel) {
                        menuLabel.innerText = 'meni';
                    }
                }
            });
        });
    </script>
</body>
</html>
