<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurica Pavičić</title>
    
    <!-- Google Fonts: Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #fff;
            color: #000;
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Subtle border frame */
        body::after {
            content: '';
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            pointer-events: none;
            z-index: 9999;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 35px 50px;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
        }

        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 10px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .menu-btn:hover {
            opacity: 1;
        }

        .menu-line {
            display: block;
            width: 26px;
            height: 1.5px;
            background-color: #000;
            margin-bottom: 6px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .menu-line:last-of-type {
            margin-bottom: 0;
        }

        .menu-text {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            color: #000;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Main layout split */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            width: 100vw;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10% 0 12%;
            z-index: 2;
        }

        .left-col h1 {
            font-size: clamp(3rem, 5.5vw, 6rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.95;
            margin-bottom: 30px;
        }

        .right-col {
            position: relative;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .right-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(102%);
        }

        /* Fullscreen Menu Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            z-index: 99998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            padding: 40px 20px;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-nav {
            list-style: none;
            text-align: center;
        }

        .menu-nav > li {
            margin-bottom: 24px;
        }

        .menu-nav a {
            font-size: clamp(2rem, 4vw, 3.2rem);
            text-decoration: none;
            color: #000;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            transition: color 0.2s, letter-spacing 0.3s;
            display: inline-block;
            font-family: 'Cormorant Garamond', serif;
        }

        .menu-nav a:hover {
            color: #555;
            letter-spacing: 1px;
        }

        /* Menu button animation state */
        body.menu-open .menu-btn {
            opacity: 1;
        }
        body.menu-open .menu-line:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        body.menu-open .menu-line:nth-child(2) {
            opacity: 0;
        }
        body.menu-open .menu-line:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        @media (max-width: 900px) {
            body::after { display: none; }
            .main-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .left-col {
                min-height: 100vh;
                padding: 120px 30px 60px 30px;
            }
            .right-col {
                height: 70vh;
            }
            .top-bar { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <button class="menu-btn" id="menuToggle" type="button" aria-label="Toggle menu">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-text" id="menuLabel">meni</span>
        </button>
    </div>

    <!-- Fullscreen Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <ul class="menu-nav">
            <li><a href="index.html" class="menu-link">Naslovnica</a></li>
            <li><a href="stranica1.html" class="menu-link">Romani</a></li>
            <li><a href="usta-puna-mora.html" class="menu-link">Usta puna mora</a></li>
        </ul>
    </div>

    <!-- Main Content Layout -->
    <main class="main-container">
        <div class="left-col">
            <h1 id="mainTitle">Jurica<br>Pavičić</h1>
        </div>
        <div class="right-col">
            <img id="heroImage" src= alt="Jurica Pavičić">
        </div>
    </main>

    <!-- Scripts: CMS Data Loader & Menu Toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Load content from Decap CMS JSON file
            try {
                const res = await fetch('content/index.json');
                if (res.ok) {
                    const data = await res.json();
                    if (data.siteTitle) document.getElementById('mainTitle').innerHTML = data.siteTitle;
                    if (data.heroImageSrc) document.getElementById('heroImage').src = data.heroImageSrc;
                }
            } catch (e) {
                console.log("Using default fallback content.");
            }

            // 2. Menu Interactions
            const menuToggle = document.getElementById('menuToggle');
            const menuOverlay = document.getElementById('menuOverlay');
            const menuLabel = document.getElementById('menuLabel');
            const menuLinks = document.querySelectorAll('.menu-link');

            if (!menuToggle || !menuOverlay) return;

            menuToggle.addEventListener('click', (e) => {
                e.preventDefault();
                document.body.classList.toggle('menu-open');
                menuOverlay.classList.toggle('active');
                if (menuLabel) {
                    menuLabel.innerText = menuOverlay.classList.contains('active') ? 'zatvori' : 'meni';
                }
            });

            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    document.body.classList.remove('menu-open');
                    menuOverlay.classList.remove('active');
                    if (menuLabel) {
                        menuLabel.innerText = 'meni';
                    }
                });
            });
        });
    </script>
</body>
</html>
