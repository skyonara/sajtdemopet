<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurica Pavičić</title>
    
    <!-- Google Fonts: Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* CHANGE THIS: Set Cormorant Garamond as your global body font, or strip Segoe UI */
        body, html {
            height: 100%;
            width: 100%;
            background-color: #f7f4ef;
            color: #2b2621;
            font-family: 'Cormorant Garamond', serif !important;
            overflow-x: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        /* Ensure paragraphs and dynamic CMS blocks also pull the serif font */
        p, span, a, li, input, button, 
        .bio-body, .content-container {
            font-family: 'Cormorant Garamond', serif !important;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #f7f4ef;
            color: #2b2621;
            overflow-x: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Subtle architectural border frame with color tint */
        body::after {
            content: '';
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(193, 114, 84, 0.2);
            pointer-events: none;
            z-index: 9999;
        }

        /* Top Bar: Back Button & Menu Toggle */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 50px;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(247,244,239,0.95) 0%, rgba(247,244,239,0) 100%);
        }

        .back-link {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #c17254;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            opacity: 0.85;
            transition: opacity 0.3s ease, color 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
            color: #2b2621;
        }

        /* Menu Button Top Right */
        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 10px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .menu-btn:hover {
            opacity: 1;
        }

        .menu-line {
            display: block;
            width: 26px;
            height: 1.5px;
            background-color: #2b2621;
            margin-bottom: 6px;
            transition: transform 0.3s ease, opacity 0.3s ease, background-color 0.3s ease;
        }

        .menu-line:last-of-type {
            margin-bottom: 0;
        }

        .menu-text {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            color: #2b2621;
        }

        /* Main Content Layout */
        .content-container {
            max-width: 1550px;
            margin: 0 auto;
            padding: 140px 70px 100px 70px;
        }

        .bio-header {
            display: grid;
            grid-template-columns: 500px 1fr;
            gap: 90px;
            align-items: start;
            margin-bottom: 80px;
        }

        .bio-portrait {
            width: 100%;
            border: 1px solid rgba(193, 114, 84, 0.25);
            box-shadow: 0 25px 50px rgba(43, 38, 33, 0.08);
            position: relative;
            background-color: #e6dfd3;
        }

        .bio-portrait::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(193, 114, 84, 0.15), rgba(74, 96, 110, 0.15));
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 1;
        }

        .bio-portrait img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(80%) contrast(105%);
        }

        /* FORCE Cormorant Garamond on CMS-injected elements and headings */
        #bioName, 
        #bioSubtitle, 
        .bio-title-area h1, 
        .bio-subtitle, 
        .bio-body h2,
        .menu-nav a, 
        .submenu-toggle {
            font-family: 'Cormorant Garamond', serif !important;
        }

        .bio-title-area h1 {
            font-size: clamp(3rem, 5vw, 4.8rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 18px;
            color: #2b2621;
        }

        .bio-subtitle {
            font-size: 1.5rem;
            color: #c17254;
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .bio-body {
            font-size: 1.15rem;
            line-height: 1.85;
            color: #443c36;
            max-width: 1100px;
        }

        .bio-body h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin-top: 50px;
            margin-bottom: 18px;
            font-weight: 600;
            color: #2b2621;
            border-left: 3px solid #c17254;
            padding-left: 14px;
        }

        .bio-body p {
            margin-bottom: 26px;
        }

        /* Fullscreen Menu Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(43, 38, 33, 0.97);
            backdrop-filter: blur(12px);
            z-index: 99998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-nav {
            list-style: none;
            text-align: center;
        }

        .menu-nav > li {
            margin-bottom: 24px;
        }

        .menu-nav a, .submenu-toggle {
            font-size: clamp(2rem, 4vw, 3.2rem);
            text-decoration: none;
            color: #f7f4ef;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s, letter-spacing 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .menu-nav a:hover, .submenu-toggle:hover {
            color: #c17254;
            letter-spacing: 1px;
        }

        .has-submenu {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .submenu-toggle::after {
            content: '+';
            font-size: 1.4rem;
            font-weight: 300;
            color: #c17254;
            transition: transform 0.3s ease;
        }

        .has-submenu.open .submenu-toggle::after {
            transform: rotate(45deg);
        }

        .submenu {
            list-style: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .has-submenu.open .submenu {
            max-height: 220px;
        }

        .submenu li {
            margin-top: 14px;
        }

        .submenu a {
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 400;
            color: #b5ada3;
        }

        .submenu a:hover {
            color: #f7f4ef;
        }

        body.menu-open .menu-btn {
            opacity: 1;
        }
        body.menu-open .menu-line {
            background-color: #f7f4ef;
        }
        body.menu-open .menu-text {
            color: #f7f4ef;
        }
        body.menu-open .menu-line:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        body.menu-open .menu-line:nth-child(2) {
            opacity: 0;
        }
        body.menu-open .menu-line:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        @media (max-width: 900px) {
            body::after { display: none; }
            .top-bar { padding: 20px; }
            .content-container { padding: 100px 20px 60px 20px; }
            .bio-header {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .bio-portrait {
                max-width: 360px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <a href="index.html" class="back-link">← Povratak na naslovnicu</a>
        <button class="menu-btn" id="menuToggle" type="button" aria-label="Toggle menu">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-text" id="menuLabel">meni</span>
        </button>
    </div>

    <!-- Fullscreen Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <ul class="menu-nav">
            <li><a href="index.html#biography" class="menu-link">Biografija</a></li>
            <li class="has-submenu" id="submenuParent">
                <button class="submenu-toggle" id="submenuToggle" type="button">Knjige / Proza</button>
                <ul class="submenu">
                    <li><a href="index.html#novels" class="menu-link">Romani</a></li>
                    <li><a href="index.html#stories" class="menu-link">Zbirke priča</a></li>
                    <li><a href="index.html#essays" class="menu-link">Eseji / Publicistika</a></li>
                </ul>
            </li>
            <li><a href="index.html#texts" class="menu-link">Tekstovi</a></li>
            <li><a href="index.html#contact" class="menu-link">Kontakt</a></li>
        </ul>
    </div>

    <!-- Main Content Area (Dynamic CMS Bindings) -->
    <main class="content-container">
        <div class="bio-header">
            <div class="bio-portrait">
                <img id="bioPortraitImg" src="" alt="Jurica Pavičić">
            </div>
            <div class="bio-title-area">
                <h1 id="bioName"></h1>
                <div class="bio-subtitle" id="bioSubtitle"></div>
                <p id="bioIntroText" style="color: #5a5047; line-height: 1.7; font-size: 1.1rem;"></p>
            </div>
        </div>

        <div class="bio-body" id="bioBodyContent"></div>
    </main>

    <!-- Script to Hydrate Content from JSON & Manage UI Interactions -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('content/biografija.json');
                const data = await response.json();

                document.getElementById('bioName').textContent = data.name || '';
                document.getElementById('bioSubtitle').textContent = data.subtitle || '';
                document.getElementById('bioIntroText').textContent = data.introText || '';
                document.getElementById('bioPortraitImg').src = data.portrait || '';
                document.getElementById('bioBodyContent').innerHTML = data.bodyContent || '';
            } catch (error) {
                console.error('Error loading content:', error);
            }

            // Menu overlay toggle logic
            const menuToggle = document.getElementById('menuToggle');
            const menuOverlay = document.getElementById('menuOverlay');
            const menuLabel = document.getElementById('menuLabel');
            const menuLinks = document.querySelectorAll('.menu-link');
            const submenuParent = document.getElementById('submenuParent');
            const submenuToggle = document.getElementById('submenuToggle');

            if (!menuToggle || !menuOverlay) return;

            menuToggle.addEventListener('click', (e) => {
                e.preventDefault();
                document.body.classList.toggle('menu-open');
                menuOverlay.classList.toggle('active');
                menuLabel.innerText = menuOverlay.classList.contains('active') ? 'zatvori' : 'meni';
                if (!menuOverlay.classList.contains('active')) submenuParent.classList.remove('open');
            });

            submenuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                submenuParent.classList.toggle('open');
            });

            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    document.body.classList.remove('menu-open');
                    menuOverlay.classList.remove('active');
                    menuLabel.innerText = 'meni';
                    submenuParent.classList.remove('open');
                });
            });
        });
    </script>
    <script>
    window.addEventListener('DOMContentLoaded', () => {
        const targetElements = document.querySelectorAll('h1, h2, h3, h4, h5, h6, p, span, a, div, .bio-body, .content-container');
        targetElements.forEach(el => {
            el.style.setProperty('font-family', "'Cormorant Garamond', serif", 'important');
        });
    });
</script>
</body>
</html>
