<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurica Pavičić</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Subtle architectural border frame */
        body::after {
            content: '';
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            pointer-events: none;
            z-index: 9999;
        }

        /* Main split screen layout */
        .hero-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .hero-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10vw;
            z-index: 2;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 5.5rem);
            font-weight: 700;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #000;
        }

        .hero-right {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
        }

        .hero-right img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(105%);
            transition: filter 0.5s ease, transform 0.7s ease;
        }

        .hero-right img:hover {
            filter: grayscale(80%) contrast(100%);
            transform: scale(1.02);
        }

        /* Menu Button Top Right */
        .menu-btn {
            position: fixed;
            top: 40px;
            right: 45px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 15px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .menu-btn:hover {
            opacity: 1;
        }

        .menu-line {
            display: block;
            width: 26px;
            height: 1.5px;
            background-color: #000;
            margin-bottom: 6px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .menu-line:last-of-type {
            margin-bottom: 0;
        }

        .menu-text {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            color: #000;
        }

        /* Fullscreen Menu Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            z-index: 99998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-nav {
            list-style: none;
            text-align: center;
        }

        .menu-nav > li {
            margin-bottom: 24px;
        }

        .menu-nav a, .submenu-toggle {
            font-size: clamp(1.5rem, 3.5vw, 2.8rem);
            text-decoration: none;
            color: #000;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s, letter-spacing 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .menu-nav a:hover, .submenu-toggle:hover {
            color: #555;
            letter-spacing: 0px;
        }

        .has-submenu {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .submenu-toggle::after {
            content: '+';
            font-size: 1.2rem;
            font-weight: 300;
            transition: transform 0.3s ease;
        }

        .has-submenu.open .submenu-toggle::after {
            transform: rotate(45deg);
        }

        .submenu {
            list-style: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .has-submenu.open .submenu {
            max-height: 220px;
        }

        .submenu li {
            margin-top: 14px;
        }

        .submenu a {
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 400;
            color: #555;
            letter-spacing: -0.5px;
        }

        .submenu a:hover {
            color: #000;
            letter-spacing: 0px;
        }

        body.menu-open .menu-btn {
            opacity: 1;
        }
        body.menu-open .menu-line:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        body.menu-open .menu-line:nth-child(2) {
            opacity: 0;
        }
        body.menu-open .menu-line:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        /* Cookie Bar Bottom */
        .cookie-bar {
            position: absolute;
            bottom: 25px;
            left: 35px;
            right: 35px;
            background-color: #fafafa;
            border: 1px solid #eaeaea;
            color: #333;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .cookie-bar a {
            color: #000;
            text-decoration: underline;
        }

        .cookie-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cookie-btn:hover {
            background: #444;
        }

        @media (max-width: 900px) {
            body::after { display: none; }
            .hero-container { flex-direction: column; }
            .hero-left { height: 50vh; padding: 30px 20px; }
            .hero-right { height: 50vh; }
            .cookie-bar {
                left: 15px;
                right: 15px;
                bottom: 15px;
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Top Right Menu Button -->
    <button class="menu-btn" id="menuToggle" type="button" aria-label="Toggle menu">
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-text" id="menuLabel">meni</span>
    </button>

    <!-- Fullscreen Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <ul class="menu-nav">
            <!-- First link updated to point to 1.html -->
            <li><a href="https://skyonara.github.io/sajtdemopet/biografija.html" class="menu-link">Biografija</a></li>
            
            <li class="has-submenu" id="submenuParent">
                <button class="submenu-toggle" id="submenuToggle" type="button">Knjige / Proza</button>
                <ul class="submenu">
                    <li><a href="#novels" class="menu-link">Romani</a></li>
                    <li><a href="#stories" class="menu-link">Zbirke priča</a></li>
                    <li><a href="#essays" class="menu-link">Eseji / Publicistika</a></li>
                </ul>
            </li>

            <li><a href="#texts" class="menu-link">Tekstovi</a></li>
            <li><a href="#contact" class="menu-link">Kontakt</a></li>
        </ul>
    </div>

    <!-- Main Split Section -->
    <div class="hero-container">
        <div class="hero-left">
            <h1 class="hero-title" id="siteTitle">
                Jurica<br>
                Pavičić
            </h1>
        </div>
        <div class="hero-right">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1000&auto=format&fit=crop" alt="Jurica Pavičić">
        </div>
    </div>

    <!-- Bottom Cookie Notice -->
    <div class="cookie-bar">
        <span>Kako bismo vam pružili najbolje iskustvo korištenja stranice ova  koristi kolačiće — <a href="#">Izjava o kolačićima</a></span>
        <button class="cookie-btn">Prihvaćam</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const siteTitle = document.getElementById('siteTitle');

            // Load saved changes from localStorage if any were made previously
            const savedTitle = localStorage.getItem('jurica_site_title');
            if (savedTitle) {
                siteTitle.innerHTML = savedTitle;
            }

            // Standard menu interactions
            const menuToggle = document.getElementById('menuToggle');
            const menuOverlay = document.getElementById('menuOverlay');
            const menuLabel = document.getElementById('menuLabel');
            const menuLinks = document.querySelectorAll('.menu-link');
            const submenuParent = document.getElementById('submenuParent');
            const submenuToggle = document.getElementById('submenuToggle');

            if (!menuToggle || !menuOverlay) return;

            function toggleMenu(e) {
                if (e) e.preventDefault();
                document.body.classList.toggle('menu-open');
                menuOverlay.classList.toggle('active');
                
                if (menuOverlay.classList.contains('active')) {
                    menuLabel.innerText = 'zatvori';
                } else {
                    menuLabel.innerText = 'meni';
                    submenuParent.classList.remove('open');
                }
            }

            menuToggle.addEventListener('click', toggleMenu);

            submenuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                submenuParent.classList.toggle('open');
            });

            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    document.body.classList.remove('menu-open');
                    menuOverlay.classList.remove('active');
                    menuLabel.innerText = 'meni';
                    submenuParent.classList.remove('open');
                });
            });
        });
    </script>

</body>
</html>
