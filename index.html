<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurica Pavičić</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Main split screen layout */
        .hero-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .hero-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 8vw;
            z-index: 2;
        }

        .hero-title {
            font-size: clamp(2.2rem, 4.5vw, 5rem);
            font-weight: 700;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -1.5px;
            color: #000;
        }

        .hero-right {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .hero-right img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            filter: grayscale(100%);
        }

        /* Menu Button Top Right */
        .menu-btn {
            position: fixed;
            top: 30px;
            right: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 15px;
            opacity: 0.6; /* Lowered opacity */
            transition: opacity 0.3s ease;
        }

        .menu-btn:hover {
            opacity: 1; /* Full opacity on hover */
        }

        .menu-line {
            display: block;
            width: 28px;
            height: 2px;
            background-color: #000;
            margin-bottom: 6px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .menu-line:last-of-type {
            margin-bottom: 0;
        }

        .menu-text {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            color: #000;
        }

        /* Fullscreen Menu Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            z-index: 99998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-nav {
            list-style: none;
            text-align: center;
        }

        .menu-nav > li {
            margin-bottom: 20px;
        }

        .menu-nav a, .submenu-toggle {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            text-decoration: none;
            color: #000;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .menu-nav a:hover, .submenu-toggle:hover {
            color: #666;
        }

        /* Submenu styling */
        .has-submenu {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .submenu-toggle::after {
            content: '+';
            font-size: 1.2rem;
            font-weight: 400;
            transition: transform 0.3s ease;
        }

        .has-submenu.open .submenu-toggle::after {
            transform: rotate(45deg);
        }

        .submenu {
            list-style: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
            text-align: center;
        }

        .has-submenu.open .submenu {
            max-height: 200px;
        }

        .submenu li {
            margin-top: 12px;
        }

        .submenu a {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 400;
            color: #444;
        }

        .submenu a:hover {
            color: #000;
        }

        /* Active state for hamburger button animation */
        body.menu-open .menu-btn {
            opacity: 1; /* Keep fully visible when menu is open */
        }

        body.menu-open .menu-line:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        body.menu-open .menu-line:nth-child(2) {
            opacity: 0;
        }
        body.menu-open .menu-line:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* Cookie Bar Bottom */
        .cookie-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            z-index: 10;
        }

        .cookie-bar a {
            color: #fff;
            text-decoration: underline;
        }

        .cookie-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 5px 15px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .hero-container {
                flex-direction: column;
            }
            .hero-left {
                height: 50vh;
                padding: 40px 20px;
            }
            .hero-right {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <!-- Top Right Menu Button -->
    <button class="menu-btn" id="menuToggle" type="button" aria-label="Toggle menu">
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-text" id="menuLabel">meni</span>
    </button>

    <!-- Fullscreen Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <ul class="menu-nav">
            <li><a href="#biography" class="menu-link">Biografija</a></li>
            
            <!-- Expandable Submenu Item -->
            <li class="has-submenu" id="submenuParent">
                <button class="submenu-toggle" id="submenuToggle" type="button">Knjige / Proza</button>
                <ul class="submenu">
                    <li><a href="#novels" class="menu-link">Romani</a></li>
                    <li><a href="#stories" class="menu-link">Zbirke priča</a></li>
                    <li><a href="#essays" class="menu-link">Eseji / Publicistika</a></li>
                </ul>
            </li>

            <li><a href="#texts" class="menu-link">Tekstovi</a></li>
            <li><a href="#contact" class="menu-link">Kontakt</a></li>
        </ul>
    </div>

    <!-- Main Split Section -->
    <div class="hero-container">
        <div class="hero-left">
            <h1 class="hero-title">
                marija<br>
                andrijašević
            </h1>
        </div>
        <div class="hero-right">
            <!-- Placeholder portrait image -->
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1000&auto=format&fit=crop" alt="Jurica Pavičić">
        </div>
    </div>

    <!-- Bottom Cookie Notice -->
    <div class="cookie-bar">
        <span>Kako bismo vam pružili najbolje iskustvo korištenja stranice ova stranica koristi kolačiće - <a href="#">Izjava o kolačićima</a></span>
        <button class="cookie-btn">Prihvaćam</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menuToggle');
            const menuOverlay = document.getElementById('menuOverlay');
            const menuLabel = document.getElementById('menuLabel');
            const menuLinks = document.querySelectorAll('.menu-link');
            const submenuParent = document.getElementById('submenuParent');
            const submenuToggle = document.getElementById('submenuToggle');

            if (!menuToggle || !menuOverlay) return;

            function toggleMenu(e) {
                if (e) e.preventDefault();
                document.body.classList.toggle('menu-open');
                menuOverlay.classList.toggle('active');
                
                if (menuOverlay.classList.contains('active')) {
                    menuLabel.innerText = 'zatvori';
                } else {
                    menuLabel.innerText = 'meni';
                    submenuParent.classList.remove('open');
                }
            }

            menuToggle.addEventListener('click', toggleMenu);

            submenuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                submenuParent.classList.toggle('open');
            });

            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    document.body.classList.remove('menu-open');
                    menuOverlay.classList.remove('active');
                    menuLabel.innerText = 'meni';
                    submenuParent.classList.remove('open');
                });
            });
        });
    </script>

</body>
</html>
